<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urgent Blood Requirement: B-ve</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .blood-group-text {
            font-family: 'Poppins', sans-serif;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-sm bg-white rounded-2xl card-shadow overflow-hidden" id="poster">
        <!-- Header Section -->
        <div class="bg-red-600 text-white text-center p-4">
            <h1 class="text-2xl md:text-3xl font-bold tracking-wider">URGENT BLOOD REQUIRED</h1>
        </div>

        <!-- Blood Group Section -->
        <div class="relative text-center p-8 bg-white">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
                 <svg class="w-48 h-48 text-red-100" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg>
            </div>
            <p class="text-gray-600 text-lg font-semibold">Blood Group</p>
            <p class="text-8xl md:text-9xl text-red-600 blood-group-text relative">B-ve</p>
            <p class="text-red-500 font-semibold mt-2">(B Negative)</p>
        </div>

        <!-- Patient Details Section -->
        <div class="px-6 py-4 bg-gray-50 border-t border-b border-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mb-3 text-center">Patient Details</h2>
            <div class="text-lg space-y-2 text-gray-700">
                <div class="flex justify-between">
                    <span class="font-semibold">Name:</span>
                    <span>Ajith Kumar</span>
                </div>
                <div class="flex justify-between">
                    <span class="font-semibold">Age:</span>
                    <span>27</span>
                </div>
                 <div class="flex justify-between">
                    <span class="font-semibold">Reason:</span>
                    <span>Plastic Surgery</span>
                </div>
                <div class="flex justify-between items-start">
                    <span class="font-semibold">Hospital:</span>
                    <span class="text-right">Chengalpattu<br>Government Hospital</span>
                </div>
            </div>
        </div>

        <!-- Contact & Location Section -->
        <div class="p-6 text-center">
            <div class="flex flex-col md:flex-row items-center justify-center gap-4">
                <!-- Contact Info -->
                <div class="flex-1 text-center">
                    <p class="text-lg text-gray-600 mb-2">Contact Donor Helpline:</p>
                    <div class="bg-green-500 text-white text-xl font-bold py-3 px-4 rounded-lg inline-block">
                        <a href="tel:+918973458522">+91 8973458522</a>
                    </div>
                </div>
                <!-- QR Code -->
                <div class="flex-1 text-center">
                     <p class="text-lg text-gray-600 mb-2">Scan for Location:</p>
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://www.google.com/maps/search/?api=1%26query=Chengalpattu+Government+Hospital" alt="QR Code for Hospital Location" class="mx-auto rounded-lg border-4 border-white shadow-lg">
                </div>
            </div>
             <p class="text-md font-semibold text-red-600 mt-6">Your help can save a life. Please share!</p>
        </div>
    </div>

</body>
</html>
