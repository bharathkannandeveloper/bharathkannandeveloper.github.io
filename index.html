<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urgent Blood Requirement Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
        }
        .card-shadow {
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
        }
        .blood-group-text {
            font-weight: 900;
            color: #DC2626; /* red-600 */
            text-shadow: 2px 2px 8px rgba(220, 38, 38, 0.2);
        }
        .modal-backdrop {
            background-color: rgba(0,0,0,0.6);
            transition: opacity 0.3s ease-in-out;
        }
        .modal-content {
            transition: transform 0.3s ease-in-out;
        }
        .loader {
            border-top-color: #3B82F6; /* blue-500 */
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }
        @-webkit-keyframes spin {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white rounded-2xl card-shadow overflow-hidden">
        <!-- Header -->
        <div class="bg-red-600 text-white text-center p-5">
            <h1 class="text-2xl font-bold tracking-wide">URGENT BLOOD REQUIREMENT</h1>
        </div>

        <!-- Main Info -->
        <div class="p-6">
            <!-- Blood Group -->
            <div class="text-center mb-6">
                <p class="text-lg font-semibold text-gray-500">Required Blood Group</p>
                <p class="text-8xl blood-group-text">B-</p>
                <p class="text-red-500 font-semibold">(B Negative)</p>
            </div>
            
            <!-- Patient Details List -->
            <div class="space-y-3 text-gray-700">
                <div class="flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-400 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                    <span class="font-semibold">Patient:</span>
                    <span class="ml-auto" id="patient-name">Ajith Kumar, 27</span>
                </div>
                <div class="flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-400 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                    <span class="font-semibold">Location:</span>
                    <span class="ml-auto text-right" id="hospital">Chengalpattu Government Hospital</span>
                </div>
                <div class="flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-400 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                    <span class="font-semibold">Reason:</span>
                    <span class="ml-auto" id="reason">Plastic Surgery</span>
                </div>
            </div>
        </div>
        
        <!-- Contact Section -->
        <div class="bg-gray-50 p-6 border-t border-b border-gray-200">
            <p class="text-center text-gray-600 mb-3">Donors, please contact immediately:</p>
            <a href="tel:+918973458522" class="w-full flex items-center justify-center bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg transition-colors text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>
                +91 8973458522
            </a>
        </div>

        <!-- AI Assistant Section -->
        <div class="p-6">
             <h3 class="text-lg font-bold text-gray-800 mb-4 text-center">AI Assistant Tools</h3>
             <div class="flex flex-col space-y-3">
                <button id="generate-appeal-btn" class="w-full flex items-center justify-center bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>
                    Generate Appeal Message
                </button>
                <button id="find-banks-btn" class="w-full flex items-center justify-center bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-4 rounded-lg transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" /></svg>
                    Find Nearby Blood Banks
                </button>
             </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="loading-modal" class="fixed inset-0 z-50 items-center justify-center hidden modal-backdrop">
        <div class="loader ease-linear rounded-full border-8 border-t-8 border-gray-200 h-24 w-24"></div>
    </div>

    <div id="appeal-modal" class="fixed inset-0 z-50 items-center justify-center hidden modal-backdrop p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg m-4 modal-content transform scale-95">
            <div class="p-6">
                <h2 class="text-2xl font-bold mb-4 text-gray-800">Generated Appeal Message</h2>
                <textarea id="appeal-text" class="w-full h-56 p-3 border rounded-md bg-gray-50 text-gray-700" readonly></textarea>
            </div>
            <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3">
                 <button id="copy-appeal-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg transition-colors">Copy Text</button>
                <button onclick="closeModal('appeal-modal')" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-lg transition-colors">Close</button>
            </div>
        </div>
    </div>

    <div id="banks-modal" class="fixed inset-0 z-50 items-center justify-center hidden modal-backdrop p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg m-4 modal-content transform scale-95">
            <div class="p-6">
                <h2 class="text-2xl font-bold mb-4 text-gray-800">Nearby Blood Banks</h2>
                <div id="banks-list" class="w-full h-80 border rounded-md bg-gray-50 overflow-y-auto"></div>
            </div>
            <div class="px-6 py-4 bg-gray-50 flex justify-end">
                <button onclick="closeModal('banks-modal')" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-lg transition-colors">Close</button>
            </div>
        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const generateAppealBtn = document.getElementById('generate-appeal-btn');
        const findBanksBtn = document.getElementById('find-banks-btn');
        const copyAppealBtn = document.getElementById('copy-appeal-btn');
        const loadingModal = document.getElementById('loading-modal');
        const appealModal = document.getElementById('appeal-modal');
        const banksModal = document.getElementById('banks-modal');
        const appealText = document.getElementById('appeal-text');
        const banksList = document.getElementById('banks-list');

        // --- Patient Data ---
        const patientData = {
            name: document.getElementById('patient-name').innerText.split(',')[0],
            age: "27",
            bloodGroup: "B-ve",
            reason: document.getElementById('reason').innerText,
            hospital: document.getElementById('hospital').innerText,
            contact: "+91 8973458522"
        };
        
        // --- Modal Functions ---
        function showModal(id) {
            const modal = document.getElementById(id);
            if(modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    const content = modal.querySelector('.modal-content');
                    if(content) content.classList.remove('scale-95');
                }, 10);
            }
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if(modal) {
                modal.classList.add('opacity-0');
                const content = modal.querySelector('.modal-content');
                if(content) content.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }, 300);
            }
        }

        // --- Gemini API Call ---
        async function callGemini(payload) {
            showModal('loading-modal');
            const apiKey = ""; // API key is handled by the environment
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
            
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status} ${response.statusText}`);
                }

                const result = await response.json();
                
                if (result.candidates && result.candidates[0]?.content?.parts[0]?.text) {
                    return result.candidates[0].content.parts[0].text;
                } else {
                    console.error("Unexpected API response structure:", result);
                    return "{\"error\": \"Sorry, I couldn't generate a valid response. Please try again.\"}";
                }

            } catch (error) {
                console.error("Error calling Gemini API:", error);
                return `{\"error\": \"An error occurred: ${error.message}. Please check the console.\"}`;
            } finally {
                closeModal('loading-modal');
            }
        }

        // --- Feature: Generate Appeal Message ---
        generateAppealBtn.addEventListener('click', async () => {
            const prompt = `Create a concise, professional, and urgent appeal message for social media (like WhatsApp and Twitter). A patient needs blood. Include these details clearly:
- Patient Name: ${patientData.name}
- Blood Group Required: ${patientData.bloodGroup} (B Negative)
- Location: ${patientData.hospital}
- Contact Number: ${patientData.contact}
- Reason: For a ${patientData.reason}.
Start with a clear, urgent heading using emojis (e.g., 🩸 URGENT BLOOD DONATION 🩸). Use bullet points for clarity. End with a strong call to action to donate and share the message widely.`;
            
            const payload = { contents: [{ role: "user", parts: [{ text: prompt }] }] };
            const generatedText = await callGemini(payload);
            appealText.value = generatedText;
            showModal('appeal-modal');
        });
        
        // --- Feature: Copy to Clipboard ---
        copyAppealBtn.addEventListener('click', () => {
            appealText.select();
            appealText.setSelectionRange(0, 99999); // For mobile devices
            try {
                document.execCommand('copy');
                copyAppealBtn.textContent = 'Copied!';
                setTimeout(() => {
                    copyAppealBtn.textContent = 'Copy Text';
                }, 2000);
            } catch (err) {
                console.error('Failed to copy text: ', err);
            }
        });

        // --- Feature: Find Nearby Blood Banks (with JSON response) ---
        findBanksBtn.addEventListener('click', async () => {
            const prompt = `Find up to 5 major blood banks or hospitals with blood donation centers near "${patientData.hospital}, Tamil Nadu, India". For each location, provide its name, full address, and a direct Google Maps link for directions.`;
            
            const payload = {
                contents: [{ role: "user", parts: [{ text: prompt }] }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            blood_banks: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        name: { type: "STRING" },
                                        address: { type: "STRING" },
                                        mapsLink: { type: "STRING" }
                                    },
                                    required: ["name", "address", "mapsLink"]
                                }
                            }
                        }
                    }
                }
            };

            const jsonString = await callGemini(payload);
            try {
                const data = JSON.parse(jsonString);
                if (data.error) {
                     banksList.innerHTML = `<div class="p-4 text-red-600">${data.error}</div>`;
                } else if (data.blood_banks && data.blood_banks.length > 0) {
                    renderBloodBanks(data.blood_banks);
                } else {
                    banksList.innerHTML = `<div class="p-4 text-gray-600">No blood banks were found. Please try a broader search.</div>`;
                }
            } catch (e) {
                console.error("Failed to parse JSON response:", e);
                banksList.innerHTML = `<div class="p-4 text-red-600">There was an error processing the data. The raw response was: <br><pre class="whitespace-pre-wrap">${jsonString}</pre></div>`;
            }
            showModal('banks-modal');
        });

        function renderBloodBanks(banks) {
            banksList.innerHTML = ''; // Clear previous results
            const listContainer = document.createElement('div');
            listContainer.className = 'divide-y divide-gray-200';
            
            banks.forEach(bank => {
                const bankElement = document.createElement('div');
                bankElement.className = 'p-4';

                bankElement.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex-1 min-w-0">
                            <p class="text-md font-semibold text-gray-800 truncate">${bank.name}</p>
                            <p class="text-sm text-gray-500 truncate">${bank.address}</p>
                        </div>
                        <a href="${bank.mapsLink}" target="_blank" rel="noopener noreferrer" class="ml-4 flex-shrink-0 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-3 rounded-lg transition-colors text-sm">
                            View Map
                        </a>
                    </div>
                `;
                listContainer.appendChild(bankElement);
            });
            banksList.appendChild(listContainer);
        }

    </script>
</body>
</html>
